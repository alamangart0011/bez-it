# bez-it.ru — single-host production (HTTPS, один IP для всех 3 доменов).
# Выделенный IP для kabinet пока не используем (перенесём позже).
#   bez-it.ru, www.bez-it.ru, kabinet.bez-it.ru → 109.73.192.126:443
# Требует /etc/letsencrypt/live/bez-it.ru/ с SAN из 3-х доменов.
# Запуск:
#   docker compose -f docker-compose.single.yml --env-file .env up -d
services:
  bez-it-db:
    image: mirror.gcr.io/library/postgres:16-alpine
    container_name: bez-it-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${BEZIT_DB_NAME:-bezit}
      POSTGRES_USER: ${BEZIT_DB_USER:-bezit}
      POSTGRES_PASSWORD: ${BEZIT_DB_PASSWORD:-bezit_change_me}
    volumes:
      - bez_it_pgdata:/var/lib/postgresql/data
      - ../../infra/sql/020_bez_it_leads.sql:/docker-entrypoint-initdb.d/020_bez_it_leads.sql:ro
    ports:
      - "127.0.0.1:5436:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${BEZIT_DB_USER:-bezit}"]
      interval: 10s
      timeout: 5s
      retries: 8

  bez-it-api:
    build:
      context: ../../backend
      dockerfile: Dockerfile
    container_name: bez-it-api
    restart: unless-stopped
    depends_on:
      bez-it-db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      API_PORT: 3001
      POSTGRES_DB: ${BEZIT_DB_NAME:-bezit}
      POSTGRES_USER: ${BEZIT_DB_USER:-bezit}
      POSTGRES_PASSWORD: ${BEZIT_DB_PASSWORD:-bezit_change_me}
      POSTGRES_HOST: bez-it-db
      POSTGRES_PORT: 5432
      JWT_SECRET: ${BEZIT_JWT_SECRET:-bezit_dev_jwt_secret_change_me_64hex}
      JWT_REFRESH_SECRET: ${BEZIT_JWT_REFRESH_SECRET:-bezit_dev_jwt_refresh_secret_change_me_64hex}
      ACCESS_TOKEN_TTL_SEC: 3600
      REFRESH_TOKEN_TTL_SEC: 2592000
      UPLOAD_ROOT: /app/uploads
      MAX_UPLOAD_BYTES: 26214400
      APP_COUNTRY_MODE: RUSSIA_ONLY
      TRUST_PROXY: 1
      DATABASE_URL: postgres://${BEZIT_DB_USER:-bezit}:${BEZIT_DB_PASSWORD:-bezit_change_me}@bez-it-db:5432/${BEZIT_DB_NAME:-bezit}
      BEZIT_TG_BOT_TOKEN: ${BEZIT_TG_BOT_TOKEN}
      BEZIT_TG_OBORON_CHAT: ${BEZIT_TG_OBORON_CHAT}
      BEZIT_TG_CENT_CHAT: ${BEZIT_TG_CENT_CHAT}
      BEZIT_TG_IP_CHAT: ${BEZIT_TG_IP_CHAT}
      BEZIT_WEBHOOK_URL: ${BEZIT_WEBHOOK_URL}
      BEZIT_CABINET_TOKEN: ${BEZIT_CABINET_TOKEN}
      BEZIT_RATE_LIMIT_PER_IP_MIN: ${BEZIT_RATE_LIMIT_PER_IP_MIN:-30}
    volumes:
      - bez_it_uploads:/app/uploads
    ports:
      - "127.0.0.1:3001:3001"

  bez-it-web:
    image: mirror.gcr.io/library/nginx:1.27-alpine
    container_name: bez-it-web
    restart: unless-stopped
    depends_on:
      - bez-it-api
    volumes:
      - ../../apps/bez-it/public:/usr/share/nginx/html/landing:ro
      - ../../apps/ip-cabinet/public:/usr/share/nginx/html/cabinet:ro
      - ./nginx.single.tls.conf:/etc/nginx/conf.d/default.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - /var/www/certbot:/var/www/certbot:ro
    ports:
      - "${BEZIT_LANDING_IP:-109.73.192.126}:80:80"
      - "${BEZIT_LANDING_IP:-109.73.192.126}:443:443"

  bez-it-bot:
    build:
      context: ../../projects/06-telegram-bot
    container_name: bez-it-bot
    restart: unless-stopped
    depends_on:
      - bez-it-api
    environment:
      BEZIT_TG_BOT_TOKEN: ${BEZIT_TG_BOT_TOKEN}
      BEZIT_API_URL: http://bez-it-api:3001/api/bez-it/leads
      BEZIT_TG_IP_CHAT: ${BEZIT_TG_IP_CHAT}
      BEZIT_BOT_MODE: ${BEZIT_BOT_MODE:-polling}
    profiles: ["bot"]

volumes:
  bez_it_pgdata:
  bez_it_uploads:
