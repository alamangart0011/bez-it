# nginx.single.tls.conf — single-host режим bez-it.ru
# Один nginx, один IP (${BEZIT_LANDING_IP}), 3 домена:
#   bez-it.ru, www.bez-it.ru → лендинг
#   kabinet.bez-it.ru         → личный кабинет (X-Frame DENY, noindex)
# SAN-cert /etc/letsencrypt/live/bez-it.ru/ должен покрывать все 3.

# HTTP → HTTPS + ACME (для всех доменов)
server {
    listen 80 default_server;
    server_name bez-it.ru www.bez-it.ru kabinet.bez-it.ru _;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# bez-it.ru — главный сайт
server {
    listen 443 ssl http2;
    server_name bez-it.ru;

    ssl_certificate     /etc/letsencrypt/live/bez-it.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/bez-it.ru/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;
    gzip_min_length 512;

    location /api/bez-it/ {
        proxy_pass http://bez-it-api:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    root /usr/share/nginx/html/landing;
    index index.html;

    error_page 404 /404.html;
    error_page 500 502 503 504 /404.html;

    location = /robots.txt  { try_files /robots.txt  =404; access_log off; }
    location = /sitemap.xml { try_files /sitemap.xml =404; access_log off; }
    location = /turbo.xml   { try_files /turbo.xml   =404; access_log off; add_header Content-Type application/rss+xml; }
    location ~* \.txt$ { add_header Cache-Control "public, max-age=86400"; access_log off; }
    location ~* \.(css|js|png|jpg|jpeg|gif|svg|woff2?|ico)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }
    location ~* \.html$ {
        expires 10m;
        add_header Cache-Control "public, must-revalidate";
    }
    location / { try_files $uri $uri/ /index.html; }
}

# www.bez-it.ru → bez-it.ru
server {
    listen 443 ssl http2;
    server_name www.bez-it.ru;
    ssl_certificate     /etc/letsencrypt/live/bez-it.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/bez-it.ru/privkey.pem;
    return 301 https://bez-it.ru$request_uri;
}

# kabinet.bez-it.ru — личный кабинет (на том же IP, но строгие заголовки)
server {
    listen 443 ssl http2;
    server_name kabinet.bez-it.ru;

    ssl_certificate     /etc/letsencrypt/live/bez-it.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/bez-it.ru/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Frame-Options DENY always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header Referrer-Policy no-referrer always;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript;
    gzip_min_length 512;

    client_max_body_size 30M;

    location /api/bez-it/ {
        proxy_pass http://bez-it-api:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    root /usr/share/nginx/html/cabinet;
    index index.html;

    location ~* \.(css|js|png|jpg|jpeg|gif|svg|woff2?|ico)$ {
        expires 7d;
        access_log off;
    }
    location / { try_files $uri $uri/ /index.html; }
}
