server {
    listen 80 default_server;
    server_name _;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;
    gzip_min_length 512;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # Кабинет ИП по префиксу /kabinet/ — для песочницы (без поддомена)
    location /kabinet/ {
        alias /usr/share/nginx/html/cabinet/;
        try_files $uri $uri/ /kabinet/index.html;
        add_header X-Robots-Tag "noindex, nofollow" always;
    }

    # API проксируется в backend
    location /api/bez-it/ {
        proxy_pass http://bez-it-api:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Лендинг
    root /usr/share/nginx/html/landing;
    index index.html;

    location = /robots.txt { try_files /robots.txt =404; access_log off; }
    location = /sitemap.xml { try_files /sitemap.xml =404; access_log off; }
    location ~* \.(css|js|png|jpg|jpeg|gif|svg|woff2?|ico)$ {
        expires 30d;
        access_log off;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
