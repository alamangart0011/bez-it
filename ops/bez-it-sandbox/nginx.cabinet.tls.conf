# nginx.cabinet.tls.conf — kabinet.bez-it.ru на выделенном IP 217.149.30.147
# Используется контейнером bez-it-cabinet-web, слушающим только этот IP.
# Цель: изолированный вход в личный кабинет, закрыт от индексации.

# HTTP → HTTPS + ACME
server {
    listen 80 default_server;
    server_name kabinet.bez-it.ru _;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
    }

    location / {
        return 301 https://kabinet.bez-it.ru$request_uri;
    }
}

# kabinet.bez-it.ru
server {
    listen 443 ssl http2;
    server_name kabinet.bez-it.ru;

    ssl_certificate     /etc/letsencrypt/live/bez-it.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/bez-it.ru/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Frame-Options DENY always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header Referrer-Policy no-referrer always;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript;
    gzip_min_length 512;

    # API кабинета (требует токен) — проксируется в общий backend
    location /api/bez-it/ {
        proxy_pass http://bez-it-api:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    root /usr/share/nginx/html/cabinet;
    index index.html;

    location ~* \.(css|js|png|jpg|jpeg|gif|svg|woff2?|ico)$ {
        expires 7d;
        access_log off;
    }
    location / { try_files $uri $uri/ /index.html; }
}
