# bez-it.ru — лендинг ИП Сапрыкина Е.В.
# Развёртывание: /etc/nginx/sites-available/bez-it.conf → sites-enabled, reload.
# Статика лежит в /var/www/bez-it/ (копия из apps/bez-it/public/).
# API bez-it делит бэкенд с основной платформой (Node + Express на 127.0.0.1:3001).

server {
    listen 80;
    listen [::]:80;
    server_name bez-it.ru www.bez-it.ru;
    return 301 https://bez-it.ru$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.bez-it.ru;
    ssl_certificate     /etc/letsencrypt/live/bez-it.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/bez-it.ru/privkey.pem;
    return 301 https://bez-it.ru$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name bez-it.ru;

    ssl_certificate     /etc/letsencrypt/live/bez-it.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/bez-it.ru/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    add_header X-Frame-Options SAMEORIGIN always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;

    root /var/www/bez-it;
    index index.html;
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;
    gzip_min_length 512;

    # Только API лидов доступно с этого домена
    location /api/bez-it/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location = /robots.txt { try_files /robots.txt =404; access_log off; }
    location = /sitemap.xml { try_files /sitemap.xml =404; access_log off; }
    location = /privacy.html { try_files $uri =404; }
    location = /oferta.html { try_files $uri =404; }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(css|js|png|jpg|jpeg|gif|svg|woff2?|ico)$ {
        expires 30d;
        access_log off;
    }
}

# Кабинет ИП — отдельный поддомен с авторизацией по токену
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name kabinet.bez-it.ru;

    ssl_certificate     /etc/letsencrypt/live/bez-it.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/bez-it.ru/privkey.pem;

    add_header X-Frame-Options DENY always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;

    root /var/www/ip-cabinet;
    index index.html;

    location /api/bez-it/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location / { try_files $uri $uri/ /index.html; }
}
