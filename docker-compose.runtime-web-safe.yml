services:
  signalum-web-preview-safe:
    build:
      context: .
      dockerfile: apps/web/Dockerfile.preview-safe
    container_name: signalum-web-preview-safe
    environment:
      NODE_ENV: production
      PORT: 3000
    ports:
      - "3301:3000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 20s
